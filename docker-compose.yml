services:
  mysql:
    image: mysql:8.0
    container_name: aicho-muse-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-aicho_muse}
      MYSQL_USER: ${MYSQL_USER:-aicho}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-aicho123}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --skip-log-bin
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root123}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: aicho-muse-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 3001
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-aicho_muse}
      MYSQL_USER: ${MYSQL_USER:-aicho}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-aicho123}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      # 创作内容加密密钥（AES-256-GCM，架构文档 §8；不设置则明文存储）
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:-}
      # AI 配置（可选，未配置则用内置教练；可留空并在管理后台配置）
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      # 语音：Fish Audio TTS（默认）
      TTS_PROVIDER: ${TTS_PROVIDER:-fish-audio}
      TTS_API_KEY: ${TTS_API_KEY:-}
      TTS_MODEL: ${TTS_MODEL:-s2.1-pro-free}
      TTS_BASE_URL: ${TTS_BASE_URL:-https://api.fish.audio}
      # 代理：muse 容器内 Fish Audio 走宿主 mihomo（只影响本服务的出站请求）
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
      NODE_USE_ENV_PROXY: ${NODE_USE_ENV_PROXY:-1}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,mysql}
    ports:
      - "${APP_PORT:-3001}:3001"
    volumes:
      - app_data:/app/data

volumes:
  mysql_data:
  app_data:
